<!doctype html>

    <title>Page not found | Triangle Calculator</title>

      * { box-sizing: border-box; }
      body {
        margin: 0;

        padding: 24px;

      .brand svg { width: 20px; height: 20px; }

      p { margin: 12px 0 24px; color: #475569; line-height: 1.6; }
      .home-link {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        color: #fff;
        background: #2563eb;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      .home-link:hover { background: #1d4ed8; }
      .home-link:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }

  <body>
